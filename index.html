<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A polished, responsive calculator built with vanilla HTML, CSS, and JavaScript for The Odin Project Foundations.">
  <title>Calculator | The Odin Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator-container">
    <main class="calculator" id="calculator" role="region" aria-label="Calculator">
      <!-- Screen / Display -->
      <section class="display" aria-live="polite">
        <div class="display-history" id="display-history" aria-hidden="true">&nbsp;</div>
        <div class="display-current" id="display-current" role="status">0</div>
      </section>

      <!-- Keypad -->
      <section class="keypad" aria-label="Calculator Keypad">
        <button type="button" class="btn btn-function btn-span-2" id="btn-clear" data-action="clear" aria-label="All Clear" aria-keyshortcuts="Escape Delete">AC</button>
        <button type="button" class="btn btn-function" id="btn-backspace" data-action="backspace" aria-label="Backspace" aria-keyshortcuts="Backspace">⌫</button>
        <button type="button" class="btn btn-operator" id="btn-divide" data-operator="/" aria-label="Divide" aria-keyshortcuts="/">÷</button>

        <button type="button" class="btn btn-digit" data-digit="7" aria-label="Seven">7</button>
        <button type="button" class="btn btn-digit" data-digit="8" aria-label="Eight">8</button>
        <button type="button" class="btn btn-digit" data-digit="9" aria-label="Nine">9</button>
        <button type="button" class="btn btn-operator" id="btn-multiply" data-operator="*" aria-label="Multiply" aria-keyshortcuts="* x X">×</button>

        <button type="button" class="btn btn-digit" data-digit="4" aria-label="Four">4</button>
        <button type="button" class="btn btn-digit" data-digit="5" aria-label="Five">5</button>
        <button type="button" class="btn btn-digit" data-digit="6" aria-label="Six">6</button>
        <button type="button" class="btn btn-operator" id="btn-subtract" data-operator="-" aria-label="Subtract" aria-keyshortcuts="-">−</button>

        <button type="button" class="btn btn-digit" data-digit="1" aria-label="One">1</button>
        <button type="button" class="btn btn-digit" data-digit="2" aria-label="Two">2</button>
        <button type="button" class="btn btn-digit" data-digit="3" aria-label="Three">3</button>
        <button type="button" class="btn btn-operator" id="btn-add" data-operator="+" aria-label="Add" aria-keyshortcuts="+">+</button>

        <button type="button" class="btn btn-digit btn-span-2" data-digit="0" aria-label="Zero">0</button>
        <button type="button" class="btn btn-digit" id="btn-decimal" data-action="decimal" aria-label="Decimal point" aria-keyshortcuts=".">.</button>
        <button type="button" class="btn btn-equals" id="btn-equals" data-action="equals" aria-label="Equals" aria-keyshortcuts="Enter =">=</button>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
